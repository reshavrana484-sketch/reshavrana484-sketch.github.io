name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          ABCB60: ${{ secrets.ABCB60 }}
          BFA7CF: ${{ secrets.BFA7CF }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('ABCB60', ''), os.environ.get('BFA7CF', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- c5f07fb149bc33c1703ceee099897c8670f3 -->', a)
          if b:
              patched = patched.replace('<!-- 343151ae738c9b9b456dca710dbcd83fa7 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
